name = "netstream-agent"
main = "src/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
LLM_BASE_URL = "https://api.anthropic.com/v1"
# Any tool-calling model your provider offers (Anthropic OpenAI-compatible endpoint here).
LLM_MODEL = "claude-haiku-5-5"
FIREBASE_PROJECT_ID = "netflixgpt-6b978"
ALLOWED_ORIGINS = "http://localhost:3000,https://netflix-gemini-4inx.vercel.app"

# Secrets (never in this file):
#   wrangler secret put LLM_API_KEY
#   wrangler secret put TMDB_READ_TOKEN     # TMDB "API Read Access Token" (v4 bearer)

# 20 agent turns per user per minute
[[ratelimits]]
name = "AGENT_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
